[package]
name = "plate-workbench"
version = "0.3.0-s7.1"
description = "Plate 笔记 + Agent 工作台（Tauri v2 后端）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["process", "sync", "io-util", "macros", "rt-multi-thread", "time"] }
notify = "6"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects", "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true

